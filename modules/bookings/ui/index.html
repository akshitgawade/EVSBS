<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>My bookings</title><link rel="stylesheet" href="/base.css"><link rel="stylesheet" href="./style.css"><script src="./app.js" defer></script></head><body><main class="bookings"><a href="/">Home</a><h1>My bookings</h1><p>Bookings last exactly 60 minutes. Payments are simulated; no bank card is required.</p><form id="book"><label>Charger ID <input name="slotId" required pattern="[a-fA-F0-9]{24}"></label><label>Start (Asia/Kolkata, whole hour) <input name="start" type="datetime-local" step="3600" required></label><button>Book and pay mock amount</button></form><p id="message" role="status"></p><button id="refresh">Refresh history</button><div id="history"></div></main></body></html>
